# Site
title: zacky's blog
subtitle: 技术、学习与生活记录
description: Zachary Darius 的个人技术博客
keywords:
  - Java
  - 大数据
  - 系统设计
  - AI
author: Zachary Darius
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://www.zctech88.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults: {}
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: []

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

# Home page and pagination
index_generator:
  path: ""
  per_page: 10
  order_by: -date
default_category: uncategorized
category_map: {}
tag_map: {}
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page

# Extensions
theme: icarus
feed:
  type: atom
  path: atom.xml
  limit: 20
sitemap:
  path: sitemap.xml
search:
  path: content.json
  field: post
  content: true
  format: html

include: []
exclude: []
ignore: []

version: 5.1.0
variant: default

logo:
  text: Zacky's Blog

head:
  favicon: /img/favicon.svg
  meta:
    - name=baidu-site-verification;content=code-HGBUFlHbXN
  manifest:
    name: zacky's blog
    short_name: Zacky Blog
    start_url: /
    theme_color: "#3273dc"
    background_color: "#ffffff"
    display: standalone
    icons:
      - src: /img/favicon.svg
        sizes: any
        type: image/svg+xml
  open_graph:
    type: blog
    image: /img/og_image.png
    site_name: zacky's blog
    author: Zachary Darius
    twitter_card: summary
  structured_data:
    author: Zachary Darius
    publisher: zacky's blog
    publisher_logo: /img/logo.svg
    image: /img/og_image.png
  rss: /atom.xml

navbar:
  menu:
    首页: /
    归档: /archives
    分类: /categories
    标签: /tags
    关于: /about
  links:
    GitHub:
      icon: fab fa-github
      url: https://github.com/zacky1230

footer:
  copyright: © 2019 - 2026 Zachary Darius
  links:
    Creative Commons:
      icon: fab fa-creative-commons
      url: https://creativecommons.org/
    Attribution 4.0 International:
      icon: fab fa-creative-commons-by
      url: https://creativecommons.org/licenses/by/4.0/
    GitHub:
      icon: fab fa-github
      url: https://github.com/zacky1230

article:
  highlight:
    theme: atom-one-light
    clipboard: true
    fold: unfolded
  readtime: true
  update_time: auto
  licenses:
    Creative Commons:
      icon: fab fa-creative-commons
      url: https://creativecommons.org/
    Attribution:
      icon: fab fa-creative-commons-by
      url: https://creativecommons.org/licenses/by/4.0/

search:
  type: insight
  index_pages: true

donates:
  - type: afdian
    url: https://afdian.net/@zacky
  - type: alipay
    qrcode: https://zc-tuchuang.oss-cn-beijing.aliyuncs.com/uPic/ali_zc.JPG
  - type: buymeacoffee
    url: https://www.buymeacoffee.com/zacky
  - type: wechat
    qrcode: https://zc-tuchuang.oss-cn-beijing.aliyuncs.com/uPic/we_zc.JPG

paypal_me:
  url: https://paypal.me/zacky1230

sidebar:
  left:
    sticky: false
  right:
    sticky: false

widgets:
  - position: left
    type: profile
    author: Zachary Darius
    author_title: Developer & Lifelong Learner
    location: Beijing
    avatar: /img/avatar.png
    avatar_rounded: true
    follow_link: https://github.com/zacky1230
    social_links:
      GitHub:
        icon: fab fa-github
        url: https://github.com/zacky1230
      RSS:
        icon: fas fa-rss
        url: /atom.xml
  - position: left
    type: categories
  - position: left
    type: toc
    index: true
    collapsed: true
    depth: 3
  - position: right
    type: recent_posts
  - position: right
    type: archives
  - position: right
    type: tags
    order_by: name
    show_count: true
  - position: right
    type: adsense
    client_id: ca-pub-3530389157835100
    slot_id: "9896619162"

plugins:
  animejs: true
  back_to_top: true
  baidu_analytics:
    tracking_id: 2f6438815bfbd06aa51a14d56cd32d57
  busuanzi: true
  gallery: true
  katex: false
  mathjax: false
  outdated_browser: false
  pjax: true
  progressbar: true

providers:
  cdn: jsdelivr
  fontcdn: google
  iconcdn: fontawesome
